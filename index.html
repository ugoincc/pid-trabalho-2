<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Processamento de Imagens</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="./css/styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>

  <header>
    <h1 class="titulo">Processamento de Imagens</h1>
    <div class="authors">
      <p>Hugo Cordeiro</p>
      <p>Renan Batalha</p>
      <p>Kelyton Lacerda</p>
    </div>
  </header>
  <body>
    <div class="output-wrapper">
      <div class="function-wrapper">
        <div class="upload-container">
          <label for="imgUpload"> Escolha uma imagem: </label>
          <input
            type="file"
            name="image"
            id="image"
            accept="image/png, image/jpeg"
          />
          <button
            type="button"
            class="custom-button"
            onclick="document.getElementById('image').click();"
          >
            Selecionar Arquivo
          </button>
        </div>
        <div class="upload-container">
          <label for="imgUpload"> Imagem Secundária: </label>
          <input
            type="file"
            name="image"
            id="secondaryImage"
            accept="image/png, image/jpeg"
          />
          <button
            type="button"
            class="custom-button"
            onclick="document.getElementById('secondaryImage').click();"
          >
            Selecionar Arquivo
          </button>
        </div>

        <div class="operation-wrapper">
          <div class="select-container">
            <select id="functionSelector">
              <option value="" selected disabled>Selecione uma operação</option>
              <option value="fun1">Escala de Cinza</option>
              <option value="fun2">Destacar Fissura</option>
              
            </select>
          </div>

          <div class="download-container">
            <a class="custom-button disabled">Download da Imagem</a>
          </div>
        </div>
      </div>
      <div class="single-output"></div>
    </div>
  </body>
</html>
